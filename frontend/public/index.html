<!DOCTYPE html>
<html lang="pt-BR" class="dark scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Eduardo Wagner — Desenvolvedor Full Stack</title>
    <meta
      name="description"
      content="Portfolio de Eduardo Gregório Wagner, Desenvolvedor Full Stack Júnior focado em Front-end. React, Node.js, PostgreSQL e integrações IoT."
    />
    <meta name="author" content="Eduardo Gregório Wagner" />
    <meta name="theme-color" content="#04050A" />

    <!-- Open Graph / redes sociais -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Eduardo Wagner — Desenvolvedor Full Stack" />
    <meta
      property="og:description"
      content="Desenvolvedor Full Stack Júnior focado em Front-end. React, Node.js, PostgreSQL e integrações IoT."
    />
    <meta property="og:image" content="%PUBLIC_URL%/images/eduardo-perfil.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Aplica o tema salvo ANTES da primeira pintura para não haver flash de
      tela branca ao carregar no modo escuro.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ew-portfolio-theme");
          var dark = stored !== "light";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-ink-950">
    <noscript>
      Este portfolio precisa de JavaScript habilitado para ser exibido.
    </noscript>
    <div id="root"></div>
  </body>
</html>
